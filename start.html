<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}" />
    <title>Вікторина</title>
</head>
<body>
    <div class="container">
        <div class="quiz-card">
            <h2>Оберіть вікторину</h2>
            <div class="quiz-selection">
                <form method="post" action="/">
                    <select name="quiz" class="quiz-select">
                        {% for id, name in q_list %}
                        <option value="{{id}}">{{name}}</option>
                        {% endfor %}
                    </select>
                    <button type="submit" class="btn btn-primary">Розпочати вікторину</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
